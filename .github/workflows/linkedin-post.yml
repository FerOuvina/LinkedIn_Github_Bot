name: Daily GitHub → LinkedIn Summary

on:
  schedule:
    # English 09:00
    - cron: "0 12 * * 1-5"
    # Spanish 10:00
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-summary:
    runs-on: ubuntu-latest
    # Every fetch has its own timeout. This leaves room for the wait when both
    # languages share a time (up to 60 minutes in post.config.json).
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Summary Script (Live)
        env:
          HUB_USER: ${{ secrets.HUB_USER }}
          # The automatic job token is an installation token and cannot call
          # /user. Use a PAT stored as GH_PAT; a secret named GITHUB_TOKEN is
          # rejected because the GITHUB_ prefix is reserved.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Empty on manual runs; on scheduled runs this is the cron that fired,
          # so the script posts only the languages due at that time.
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node ./scripts/dailySummary.js
