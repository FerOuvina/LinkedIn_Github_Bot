name: Daily GitHub → LinkedIn Summary

on:
  schedule:
    - cron: "0 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-summary:
    runs-on: ubuntu-latest
    # Every fetch has its own timeout, so the job should never need hours.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Daily Summary Script (Live)
        env:
          HUB_USER: ${{ secrets.HUB_USER }}
          # The automatic job token. A secret named GITHUB_TOKEN is rejected by
          # the API (reserved prefix), which is why this is not a repository secret.
          GITHUB_TOKEN: ${{ github.token }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POST_LANGUAGE: ${{ secrets.POST_LANGUAGE }}
        run: node ./scripts/dailySummary.js
