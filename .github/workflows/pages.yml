name: Deploy GitHub Pages

on:
  push:
    paths:
      - "index.html"
      - "privacy-policy.md"

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a superseded deploy linger.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Stage only the site assets instead of publishing the whole repository
      # (package.json, scripts/, tests/ and node_modules were included before).
      - name: Stage site files
        run: |
          mkdir -p _site
          cp index.html privacy-policy.md _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        uses: actions/deploy-pages@v4
